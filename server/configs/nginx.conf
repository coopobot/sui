# Nginx 反向代理配置 — 随手记 Sui 服务端
#
# 功能：
#   - HTTP 反代到 sui-server（默认 127.0.0.1:8080）
#   - WebSocket 升级支持（/api/v1/ws）
#   - 合理的超时与缓冲区设置
#   - 客户端真实 IP 透传
#
# 使用方式（Docker Compose 部署见 deployment.md）：
#   - 直接挂载到 /etc/nginx/conf.d/default.conf
#   - 或作为站点配置放到 /etc/nginx/conf.d/sui.conf

server {
    listen 80;
    server_name _;

    # 客户端最大请求体大小（上传附件用，按需调整）
    client_max_body_size 100m;

    # ── WebSocket 专用位置 ──────────────────────────────────────
    location /api/v1/ws {
        proxy_pass http://sui-server:8080;
        proxy_http_version 1.1;

        # WebSocket 升级头
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 透传客户端信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 连接超时（长连接，设长一些）
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── 通用 API 反代 ───────────────────────────────────────────
    location / {
        proxy_pass http://sui-server:8080;
        proxy_http_version 1.1;

        # 透传客户端信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # 缓冲区设置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }
}
