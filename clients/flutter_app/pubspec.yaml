name: sui_flutter_app
description: 随手记 Sui — 多端客户端（离线优先笔记：本地 SQLite + 多端同步）
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  note_core:
    path: ../note_core
  flutter_markdown: ^0.7.0
  provider: ^6.1.0
  intl: ^0.19.0
  path: ^1.9.0
  path_provider: ^2.1.0
  web_socket_channel: ^3.0.0
  # 附件选择：一套 API 覆盖 Web / 桌面 / 移动（`withData: true` 直接拿字节，
  # 因此客户端无需 `dart:io`，Web 构建不受影响）。
  file_picker: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true