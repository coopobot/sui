<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>随手记 Sui - 扩展设置</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      color: #333;
      padding: 40px 20px;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    h1 {
      font-size: 20px;
      margin-bottom: 24px;
      color: #222;
    }
    .field {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #555;
      margin-bottom: 6px;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102,126,234,0.15);
    }
    .hint {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }
    .btn {
      width: 100%;
      padding: 11px 16px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .status {
      margin-top: 16px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      text-align: center;
      display: none;
    }
    .status.success { display: block; background: #e8f5e9; color: #2e7d32; }
    .status.error { display: block; background: #ffebee; color: #c62828; }
    .about {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #eee;
      text-align: center;
      font-size: 12px;
      color: #888;
      line-height: 1.6;
    }
    .about-name { color: #555; font-weight: 500; }
  </style>
</head>
<body>
  <div class="container">
    <h1>随手记 Sui — 扩展设置</h1>
    <form id="settingsForm">
      <div class="field">
        <label for="serverUrl">服务端地址</label>
        <input type="text" id="serverUrl" placeholder="http://localhost:8080">
        <div class="hint">你的 Sui 同步服务地址</div>
      </div>
      <div class="field">
        <label for="token">访问 Token</label>
        <input type="password" id="token" placeholder="粘贴你的访问令牌">
        <div class="hint">在 App 中注册账号后获取</div>
      </div>
      <button type="submit" class="btn">保存设置</button>
      <div class="status" id="status"></div>
    </form>
    <div class="about">
      <div class="about-name">随手记 Sui · 网页剪藏</div>
      <div id="extVersion">版本 —</div>
    </div>
  </div>
  <script src="options.js"></script>
</body>
</html>
